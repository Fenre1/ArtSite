<section class="catalog-intro">
  <div class="catalog-intro__layout">
    <h1 class="page-title">{{ artist_name }}</h1>
    <div class="catalog-intro__copy">
      <p class="page-lead">{{ tagline }}</p>
      <p class="catalog-intro__body">{{ intro }}</p>
    </div>
  </div>
</section>

<section class="featured-section" aria-labelledby="featured-heading">
  <div class="section-heading">
    <p class="section-kicker">Uitgelicht</p>
  </div>
  <div class="featured-grid">
    {{ featured_cards }}
  </div>
</section>

<section class="gallery-section" aria-labelledby="gallery-heading" data-gallery-root>
  <div class="section-heading">
    <p class="section-kicker">Collectie</p>
    <h3 id="gallery-heading">Bekijk de volledige galerij</h3>
  </div>

  {{ filter_controls }}

  <div class="gallery-grid" data-gallery-grid>
    {{ gallery_cards }}
  </div>

  <p class="empty-state" data-empty-state hidden>Geen werken gevonden binnen de huidige filters.</p>
</section>
